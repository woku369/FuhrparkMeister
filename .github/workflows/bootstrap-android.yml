name: Android-Ordner ins Repo aufnehmen (einmalig)

# Einmaliger Hilfs-Workflow: erzeugt den android/-Ordner ein letztes Mal per
# 'flutter create', trägt unsere Anpassungen (feste Signatur, Desugaring)
# dauerhaft ein statt sie bei jedem Lauf per Text-Anhängen nachzupatchen,
# und committet den Ordner fest ins Repo. Wird danach wieder gelöscht - ab
# dann ist android/ ein normaler, direkt bearbeitbarer Teil des Repos.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - name: Android-Ordner erzeugen (nur falls noch nicht vorhanden)
        working-directory: app
        run: |
          if [ -d android ]; then
            echo "android/ existiert bereits - nichts zu tun."
            exit 0
          fi
          flutter create . --platforms=android --org at.kraeutermeister
          rm -f test/widget_test.dart

      - name: Festen Debug-Keystore direkt ins App-Modul kopieren
        working-directory: app
        run: cp ../ci/debug.keystore android/app/debug.keystore

      - name: Core Library Desugaring + feste Signatur dauerhaft eintragen
        working-directory: app
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF

      - name: android/.gitignore auf minimale, sichere Ausschluesse setzen
        # Flutters generierte .gitignore schliesst u. a. *.keystore/*.jks
        # aus - genau die Datei, die wir bewusst committen wollen.
        working-directory: app
        run: |
          cat > android/.gitignore <<'EOF'
          .gradle/
          /captures/
          /local.properties
          GeneratedPluginRegistrant.java
          EOF

      - name: android/-Ordner committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/android
          git status
          git commit -m "Android-Projektordner fest ins Repo aufnehmen

          Bisher wurde android/ bei jedem CI-Lauf frisch per 'flutter create'
          erzeugt und Anpassungen (Signatur, Desugaring) per Text-Anhaengen
          nachtraeglich reingepatcht. Das hat sich als fehleranfaellig
          erwiesen (siehe Commit zur APK-Signatur: ein impliziter
          Konventionspfad hat sich anders verhalten als angenommen). Jetzt
          ist der Ordner ein normaler, direkt inspizierbarer und
          bearbeitbarer Teil des Repos - Voraussetzung fuer die geplante
          native Empfangs-Funktion (Import per Android-Teilen-Dialog)."
          git push origin HEAD:${{ github.ref_name }}
