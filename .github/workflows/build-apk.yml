name: APK bauen

on:
  push:
    branches:
      - claude/fleet-management-app-waoyst
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fest gepinnt statt 'channel: stable' allein: der android/-Ordner
          # ist jetzt fest im Repo (siehe unten) statt bei jedem Lauf neu
          # generiert - ohne feste Version könnte ein künftiges Flutter-
          # Stable-Update Gradle-/AGP-Anforderungen ändern, die zum
          # eingecheckten Projektstand nicht mehr passen.
          flutter-version: 3.47.5

      - run: flutter pub get
      - run: flutter analyze
      - name: APK bauen (versionCode = eindeutige, strikt steigende GitHub-Run-Nummer)
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: APK-Signatur mit apksigner verifizieren (Diagnose Installationsfehler)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -iname "apksigner" -type f | sort -V | tail -1)
          echo "Verwende: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: APK-Metadaten (vollständig) mit aapt2 ausgeben (Diagnose)
        run: |
          AAPT2=$(find "$ANDROID_HOME" -iname "aapt2" -type f | sort -V | tail -1)
          echo "Verwende: $AAPT2"
          "$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk \
            | grep -v "^application-label-"

      - name: APK als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: fuhrparkmeister-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Als herunterladbares Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "FuhrparkMeister – aktueller Build"
          body: >
            Build-Nummer (versionCode) ${{ github.run_number }} · Version 1.0.0 ·
            Commit `${{ github.sha }}` auf `${{ github.ref_name }}`.
            Direkt auf dem Handy herunterladen und installieren
            ("Installation aus unbekannten Quellen" erlauben). In den
            Android-App-Infos zu FuhrparkMeister lässt sich die installierte
            Version gegenprüfen (Einstellungen → Apps → FuhrparkMeister →
            Erweitert), dort steht "1.0.0 (${{ github.run_number }})" -
            das sollte mit der hier verlinkten Nummer übereinstimmen.
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
