name: APK bauen

on:
  push:
    branches:
      - claude/fleet-management-app-waoyst
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android-Plattform-Ordner erzeugen (falls im Repo nicht vorhanden)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org at.kraeutermeister
            # Generischer Beispieltest von 'flutter create' passt nicht zu
            # unserer App (referenziert Platzhalterklasse MyApp) - entfernen.
            rm -f test/widget_test.dart
          fi

      - name: Festen Debug-Keystore direkt ins App-Modul kopieren
        # Bewusst NICHT auf den impliziten Standardpfad ~/.android/debug.keystore
        # verlassen: Auf den GitHub-Runner-Images liegt dort teils schon ein
        # image-eigener Debug-Keystore, den Android Gradle Plugin statt unseres
        # kopierten verwendet - jede APK wurde dadurch trotzdem mit wechselndem
        # Schlüssel signiert (per Zertifikatsvergleich nachgewiesen: SHA-256 der
        # gebauten APK wich vom SHA-256 unseres ci/debug.keystore ab). Stattdessen
        # liegt die Datei jetzt im App-Modul selbst und wird unten explizit als
        # Pfad referenziert - kein impliziter Konventionspfad mehr im Spiel.
        run: cp ../ci/debug.keystore android/app/debug.keystore

      - name: Core Library Desugaring + feste Signatur für Release-Build aktivieren
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - name: APK bauen (versionCode = eindeutige, strikt steigende GitHub-Run-Nummer)
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: APK als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: fuhrparkmeister-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Als herunterladbares Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "FuhrparkMeister – aktueller Build"
          body: >
            Build-Nummer (versionCode) ${{ github.run_number }} · Version 1.0.0 ·
            Commit `${{ github.sha }}` auf `${{ github.ref_name }}`.
            Direkt auf dem Handy herunterladen und installieren
            ("Installation aus unbekannten Quellen" erlauben). In den
            Android-App-Infos zu FuhrparkMeister lässt sich die installierte
            Version gegenprüfen (Einstellungen → Apps → FuhrparkMeister →
            Erweitert), dort steht "1.0.0 (${{ github.run_number }})" -
            das sollte mit der hier verlinkten Nummer übereinstimmen.
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
